version: 2
updates:
  # Python dependencies in requirements.txt — keeps django-mindoff and the chart
  # tooling current. When django-mindoff bumps, refresh benchmarks/ + the README note.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    target-branch: root
    labels:
      - internal
    commit-message:
      prefix: "⬆️"
    open-pull-requests-limit: 5

  # GitHub Actions used in our workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    target-branch: root
    labels:
      - internal
    commit-message:
      prefix: "⬆️"
