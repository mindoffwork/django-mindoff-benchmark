<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>404 | Django Mindoff</title>
		<meta
			name="description"
			content="Page not found. Continue with the Django Mindoff homepage or documentation."
		/>
		<style>
			@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap");

			:root {
				--mo-white: #ffffff;
				--mo-fawn: #faf5ee;
				--mo-black: #000000;
				--mo-green: #d8e995;
				--mo-yellow: #f7ec87;
				--line: rgba(0, 0, 0, 0.08);
				--muted: rgba(0, 0, 0, 0.68);
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				padding: 0;
			}

			body {
				min-height: 100vh;
				background: var(--mo-fawn);
				color: var(--mo-black);
				font-family: "Poppins", sans-serif;
				line-height: 1.6;
			}

			.page {
				width: min(980px, calc(100% - 2rem));
				margin: clamp(1rem, 3vw, 2.5rem) auto;
				overflow: hidden;
				opacity: 0;
				transform: translateY(12px);
				animation: page-enter 420ms ease-out forwards;
			}

			.topbar {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 1rem;
				padding: 0.9rem 1.2rem;
			}

			.brand {
				display: inline-flex;
				align-items: center;
				gap: 0.7rem;
				text-decoration: none;
				color: var(--mo-black);
			}

			.brand img {
				display: block;
				width: 30px;
				height: 30px;
				border-radius: 8px;
			}

			.brand-name {
				margin: 0;
				font-size: 0.96rem;
				font-weight: 700;
				letter-spacing: 0.02em;
			}

			main {
				padding: clamp(1.6rem, 3vw, 2.6rem) 1.2rem clamp(1.4rem, 3vw, 2.2rem);
			}

			h1 {
				margin: 0;
				font-size: clamp(1.3rem, 4.1vw, 2.2rem);
				line-height: 1.08;
				letter-spacing: -0.02em;
				font-weight: 900;
				max-width: 20ch;
			}

			.lead {
				margin: 0.95rem 0 0;
				max-width: 70ch;
				color: var(--muted);
				font-size: 0.99rem;
			}

			.invite {
				margin: 1.15rem 0 0;
				max-width: 68ch;
				padding: 0.8rem 0.9rem;
				border: 1px solid var(--line);
				border-radius: 10px;
				background: color-mix(
					in srgb,
					var(--mo-green) 24%,
					var(--mo-white) 76%
				);
				font-size: 0.9rem;
				color: rgba(0, 0, 0, 0.8);
			}

			.actions {
				margin-top: 1.25rem;
				display: flex;
				gap: 0.75rem;
				flex-wrap: wrap;
			}
			.status {
				font-size: 0.74rem;
				font-weight: 700;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				padding: 0.26rem 0.58rem;
				border: 1px solid var(--line);
				border-radius: 999px;
				background: color-mix(in srgb, var(--mo-red) 12%, var(--mo-white) 88%);
			}
			.btn {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				padding: 0.58rem 0.9rem;
				border-radius: 10px;
				border: 2px solid var(--line);
				text-decoration: none;
				color: var(--mo-black);
				font-size: 0.8rem;
				font-weight: 700;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				transition:
					transform 160ms ease,
					background-color 160ms ease,
					border-color 160ms ease;
			}

			.btn-primary {
				background: var(--mo-yellow);
				border-color: rgba(0, 0, 0, 0.15);
			}

			.btn-secondary {
				background: var(--mo-white);
			}

			.btn-primary:hover {
				background: color-mix(
					in srgb,
					var(--mo-yellow) 84%,
					var(--mo-green) 16%
				);
			}

			.btn-secondary:hover {
				background: color-mix(in srgb, var(--mo-fawn) 84%, var(--mo-white) 16%);
			}

			@keyframes page-enter {
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.page {
					opacity: 1;
					transform: none;
					animation: none;
				}

				.btn {
					transition: none;
				}

				.btn:hover {
					transform: none;
				}
			}

			@media (max-width: 640px) {
				.page {
					width: calc(100% - 1rem);
					border-radius: 14px;
				}

				.topbar,
				main {
					padding-left: 0.95rem;
					padding-right: 0.95rem;
				}
			}
		</style>
	</head>
	<body>
		<div class="page">
			<header class="topbar">
				<a class="brand" href="/">
					<img
						src="https://cdn.jsdelivr.net/gh/mindoffwork/django-mindoff@root/apps/django_mindoff/docs/_assets/MindOff_Logo_YellowRounded_192x192.png"
						alt="Django Mindoff logo"
						loading="eager"
					/>
					<p class="brand-name">Django Mindoff</p>
				</a>
				<span class="status">Error 404</span>
			</header>

			<main aria-labelledby="title">
				<h1 id="title">This route is missing.</h1>
				<p class="lead">
					The page you requested does not exist or was moved. Return to the home
					page.
				</p>
				<div class="actions">
					<a class="btn btn-primary" href="/">Go to Home</a>
				</div>
			</main>
		</div>
	</body>
</html>
